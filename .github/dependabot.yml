# Basic `dependabot.yml` file with minimum configuration

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    assignees:
      - "aleixalonso"
    ignore:
      # ts-jest peer range is >=4.3 <7, so typescript 7.x breaks npm ci
      - dependency-name: "typescript"
    groups:
      all-dependencies:
        patterns:
          - "*"
